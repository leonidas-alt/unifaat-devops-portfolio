name: CI Pipeline — Aula 08

on:
  push:
    branches: [main, develop]
    paths:
      - 'aula-08/**'
      - '.github/workflows/ci-aula08.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aula-08/**'
  workflow_dispatch:

# B4: Concurrency — cancela runs anteriores em progresso na mesma branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: aula-08

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aula-08/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

  test:
    name: Tests (Jest) — Node ${{ matrix.node-version }}
    needs: lint
    runs-on: ubuntu-latest

    # B1: Matrix Strategy — roda em Node 18 e Node 20
    strategy:
      matrix:
        node-version: ['18', '20']

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # B2: Cache por versão do Node
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: aula-08/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always() && matrix.node-version == '20'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: aula-08/coverage/
          retention-days: 14

      # B3: Comentar resultado do CI em Pull Requests
      - name: Comentar resultado no PR
        if: github.event_name == 'pull_request' && matrix.node-version == '20'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('<!-- ci-aula08 -->')
            );

            const body = `<!-- ci-aula08 -->
            ## ✅ CI Aula 08 — Resultado dos Testes

            | Etapa | Status |
            |-------|--------|
            | 🔍 Lint (ESLint) | ✅ Passou |
            | 🧪 Tests (Node 18) | ✅ Passou |
            | 🧪 Tests (Node 20) | ✅ Passou |

            **Commit:** \`${{ github.sha }}\`
            **Branch:** \`${{ github.head_ref }}\`
            **Rodada em:** ${new Date().toISOString()}

            > Relatório de coverage disponível nos Artifacts desta execução.
            `;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  build:
    name: Build (Docker)
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # R5: Secrets referenciados no workflow
      - name: Configurar ambiente de build
        run: |
          echo "Região AWS configurada: ${{ secrets.AWS_REGION }}"
          echo "Ambiente: ${{ secrets.APP_ENV }}"

      - name: Build da imagem Docker
        working-directory: aula-08
        run: docker build -t technova-api:${{ github.sha }} .

      - name: Verificar imagem criada
        working-directory: aula-08
        run: docker images technova-api

      # B5: Smoke test — inicia container, testa /health, para e remove
      - name: Testar container (smoke test)
        run: |
          docker run -d --name test-container -p 3000:3000 technova-api:${{ github.sha }}
          sleep 3
          curl -f http://localhost:3000/health || exit 1
          docker stop test-container
          docker rm test-container
        working-directory: aula-08

      - name: Remover container em caso de falha
        if: failure()
        run: |
          docker stop test-container 2>/dev/null || true
          docker rm test-container 2>/dev/null || true
